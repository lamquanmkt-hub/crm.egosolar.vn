upload_max_filesize = 2048M
post_max_size = 2100M
memory_limit = 6000M
max_execution_time = 6000
max_input_time = 6000
max_file_uploads=200
display_errors = Off
error_log = "error_log"
log_errors = Off
max_input_vars = 1000
session.gc_maxlifetime = 1440
session.save_path = "/opt/alt/php83/var/lib/php/session"
zlib.output_compression = On
